name: Auto-merge my documentation PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: |
      startsWith(github.head_ref, 'docs/') ||
      startsWith(github.head_ref, 'vibe/') ||
      (
        startsWith(github.head_ref, '[Snyk]') &&
        !contains(github.head_ref, 'alpine')
      ) ||
      (
        startsWith(github.head_ref, '[Aikido] AI Fix') &&
        !contains(github.head_ref, 'alpine')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
